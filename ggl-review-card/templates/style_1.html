<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!--
        Template metadata. These are parsed by the PHP loader; everything
        else in this file is plain HTML/CSS rendered inside an iframe.
    -->
    <meta name="template-id"        content="style_1">
    <meta name="template-name"      content="Classic">
    <meta name="canvas-width"       content="1240">
    <meta name="canvas-height"      content="1754">
    <meta name="swatch-background"  content="#ffffff">
    <meta name="swatch-accent"      content="#4285F4">
    <meta name="swatch-text"        content="#202124">

    <title>Classic Google Review Card</title>

    <style>
        /*
            Placeholders available inside this file:
              {{business_name}}   the business name from the form
              {{banner_text}}     the banner text from the form
              {{review_url}}      the raw review URL (href attribute)
              {{email}}           the email from step 1
              {{qr_code}}         URL to a QR image for {{review_url}}

            The canvas the template is rendered into is sized from the
            canvas-width / canvas-height meta tags above (A5 at 150 DPI
            by default). Design your CSS for that pixel size.
        */

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 1240px;
            height: 1754px;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #202124;
            position: relative;
            padding: 120px 80px 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .top-bar,
        .bottom-bar {
            position: absolute;
            left: 0;
            right: 0;
            height: 30px;
            background: #4285F4;
        }
        .top-bar    { top: 0; }
        .bottom-bar { bottom: 0; }

        .logo {
            width: 260px;
            height: auto;
            margin-bottom: 30px;
        }

        .stars {
            font-size: 130px;
            color: #fbbc05;
            letter-spacing: 14px;
            line-height: 1;
            margin-bottom: 10px;
        }

        .label {
            font-size: 42px;
            color: #5f6368;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .business-name {
            font-size: 86px;
            font-weight: bold;
            color: #202124;
            line-height: 1.15;
            margin-bottom: 26px;
            max-width: 1060px;
            word-wrap: break-word;
        }

        .banner-text {
            font-size: 46px;
            color: #3c4043;
            line-height: 1.4;
            margin-bottom: 40px;
            max-width: 1000px;
        }

        .qr-wrap {
            padding: 28px;
            background: #ffffff;
            border: 8px solid #4285F4;
            border-radius: 22px;
            display: inline-block;
            margin: 10px 0 32px;
        }

        .qr-wrap img {
            display: block;
            width: 560px;
            height: 560px;
        }

        .cta {
            font-size: 54px;
            font-weight: bold;
            color: #202124;
        }
    </style>
</head>
<body>

    <div class="top-bar"></div>

    <!-- Inline Google "G" logo so there is no external image dependency. -->
    <svg class="logo" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 4.1 29.6 2 24 2 11.8 2 2 11.8 2 24s9.8 22 22 22c11 0 21-8 21-22 0-1.3-.2-2.7-.5-4z"/>
        <path fill="#34A853" d="M6.3 14.7l7 5.1C15.2 16.2 19.3 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#FBBC05" d="M24 46c5.5 0 10.5-2.1 14.3-5.5l-6.6-5.6c-2 1.4-4.7 2.3-7.7 2.3-6.1 0-11.3-4.1-13.1-9.7l-7.1 5.4C7.6 41.2 15.2 46 24 46z"/>
        <path fill="#EA4335" d="M44.5 20H24v8.5h11.8c-1.1 3.1-3.5 5.5-6.5 7l6.6 5.6C40.3 37.4 44 31.3 44 24c0-1.3-.2-2.7-.5-4z"/>
    </svg>

    <div class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</div>

    <div class="label">GOOGLE REVIEWS</div>

    <div class="business-name">{{business_name}}</div>

    <div class="banner-text">{{banner_text}}</div>

    <div class="qr-wrap">
        <img src="{{qr_code}}" alt="Scan to leave a review">
    </div>

    <div class="cta">Scan to leave a review</div>

    <div class="bottom-bar"></div>

</body>
</html>
